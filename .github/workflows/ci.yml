name: NEO-MAXIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure test build
        run: cmake -S . -B build-ci -DNEOMAXIS_BUILD_TESTS=ON

      - name: Build test executables
        run: cmake --build build-ci --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

  windows-dll:
    name: Windows DLL (MSVC x86)
    if: github.event_name == 'push'
    runs-on: windows-2022

    steps:
      - name: Check out NEO-MAXIS
        uses: actions/checkout@v4

      - name: Check out private sc2kfix integration
        uses: actions/checkout@v4
        with:
          repository: DaddyZer0/sc2kfix-neomaxis
          ref: main
          token: ${{ secrets.SC2KFIX_READ_TOKEN }}
          path: sc2kfix-source
          persist-credentials: false

      - name: Configure MSVC x86 build
        run: cmake -S . -B build-windows -A Win32 "-DSC2KFIX_SOURCE_DIR=$env:GITHUB_WORKSPACE\sc2kfix-source"

      - name: Build DLL
        run: cmake --build build-windows --config Release --parallel 2

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: neomaxis-windows-x86
          path: build-windows/Release/neomaxis.dll
          if-no-files-found: error
